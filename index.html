<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чеки</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#0b0d12;--card:#151922;--tx:#eef1f6;--sub:#7c8596;--ln:#232a36;--ac:#8aa8ff;--rd:#ff6b6b;--bar:rgba(11,13,18,.88);--r:14px;--on:#0b0d12;--sh:rgba(138,168,255,.3);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Golos Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 16px 110px}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px;margin:8px 0 14px;display:flex;justify-content:space-between;align-items:center}
h4{font-size:13px;color:var(--sub);text-transform:uppercase;margin:22px 16px 6px;font-weight:400}
select{font:15px inherit;color:var(--ac);background:none;border:0;appearance:none;padding:4px 8px}
.card,.grp{background:var(--card);border-radius:var(--r);overflow:hidden}
.seg{display:flex;background:rgba(118,118,128,.18);border-radius:9px;padding:2px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;color:var(--tx);font:600 13px inherit;padding:7px;border-radius:7px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.big{padding:18px}.big small{color:var(--sub);font-size:14px}.big div{font-size:38px;font-weight:700;letter-spacing:-1px}
.chart{display:flex;align-items:flex-end;gap:8px;height:140px;padding:0 18px 12px}
.chart i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-style:normal;font-size:11px;color:var(--sub)}
.chart b{display:block;width:100%;background:var(--ac);opacity:.35;border-radius:5px 5px 2px 2px;min-height:3px;margin-bottom:5px}
.chart i.cur b{opacity:1}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--ln);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font:inherit;text-align:left}
.li:last-child{border-bottom:0}.li small{display:block;color:var(--sub);font-size:13px}.li .v{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:60px 20px}
#tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--ln);display:flex;justify-content:space-around;align-items:center;z-index:5}
#tabs button{background:none;border:0;color:var(--sub);font:10px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
#tabs button span{font-size:22px}#tabs button.on{color:var(--ac)}
#tabs .plus{width:52px;height:52px;border-radius:26px;background:var(--ac);color:var(--on);font-size:30px;line-height:1;min-width:0;justify-content:center;box-shadow:0 4px 12px var(--sh)}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bar);border-bottom:.5px solid var(--ln)}
.lk{background:none;border:0;color:var(--ac);font:inherit}.lk.b{font-weight:600}
.sc{overflow:auto;padding:12px 16px 40px;flex:1;max-width:640px;width:100%;margin:0 auto}
.grp label{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--ln);gap:12px}
.grp input{border:0;background:none;color:var(--tx);font:inherit;text-align:right;min-width:0;flex:1;outline:0}
.row2{display:flex;gap:8px;padding:10px 16px;border-bottom:.5px solid var(--ln);align-items:center}
.row2 input:first-child{text-align:left;flex:3}.row2 input+input{flex:1;max-width:90px}
.x{border:0;background:none;color:var(--rd);font-size:22px;padding:0 4px}
.add{display:block;padding:12px 16px;width:100%;text-align:left}
.ph{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r);margin-bottom:14px}
.photo{width:100%;border-radius:var(--r);margin-top:6px}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:640px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sh button{background:var(--card);border:0;color:var(--ac);font:19px inherit;padding:16px;border-radius:var(--r)}
.sh button.c{font-weight:600}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.busy div{background:rgba(40,40,42,.95);padding:24px 30px;border-radius:16px;text-align:center}
.sp{width:28px;height:28px;border:3px solid #888;border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:rgba(40,40,42,.95);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;max-width:90%;text-align:center}

h1,.big div{font-family:inherit}
.grp select{flex:1;min-width:0;text-align:right;text-align-last:right;font-size:16px;color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:none;border:0;background:var(--card);color:var(--tx);font-size:14px;font-family:inherit;padding:8px 14px;border-radius:20px;white-space:nowrap}
.ch.on{background:var(--ac);color:var(--on)}.ch.add{color:var(--ac)}
.fa{display:flex;justify-content:space-between;align-items:center;margin:0 4px 12px;color:var(--sub);font-size:14px}.fa button{background:none;border:0;color:var(--ac);font-size:14px;font-family:inherit}
.pk{width:100%;max-width:640px;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.pk h3{margin:0 0 14px;font-size:17px;text-align:center}
.fi{width:100%;background:var(--card);border:0;color:var(--tx);font-size:17px;font-family:inherit;padding:14px;border-radius:var(--r);margin-bottom:12px;outline:0}
.pb{width:100%;border:0;background:var(--ac);color:var(--on);font-size:17px;font-weight:600;font-family:inherit;padding:14px;border-radius:var(--r);margin-bottom:8px}.pb.d{background:var(--card);color:var(--rd);font-weight:400}
.dn{width:150px;height:150px;border-radius:50%;margin:20px auto;position:relative}.dn::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--card)}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px}
.ic{background:none;border:0;font-size:22px;padding:0 4px}
.sq{width:100%;background:var(--card);border:0;color:var(--tx);font-size:16px;font-family:inherit;padding:11px 14px;border-radius:12px;margin-bottom:12px;outline:0}
.pg{height:8px;background:var(--ln);border-radius:4px;margin:10px 0;overflow:hidden}.big .pg{font-size:0}.pg b{display:block;height:100%}
.row2{flex-wrap:wrap}.pb.g{background:var(--card);color:var(--tx);font-weight:400}
.bn{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:14px}.bn span{flex:1}.bn button{background:none;border:0;color:var(--ac);font:inherit;font-weight:600}.bn .bx{color:var(--sub);font-size:18px;font-weight:400;padding:0 2px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--sub);background:none;color:var(--on);margin-right:12px;flex:none;font-size:13px;padding:0}.ck.on{background:var(--ac);border-color:var(--ac)}
</style></head>
<body>
<div id="app"></div>
<div id="tabs">
<button data-act="v:stats" id="t1"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20V9M3 20h18"/></svg></span>Статистика</button>
<button data-act="v:hist" id="t2"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span>История</button>
<button class="plus" data-act="plus">+</button>
<button data-act="v:list" id="t3"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/></svg></span>Список</button>
<button data-act="cfg"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>Настройки</button>
</div>
<div id="modal"></div>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<input type="file" accept="image/*" id="gal" multiple hidden>
<input type="file" accept=".json,application/json" id="imp" hidden>
<script>
const $=s=>document.querySelector(s);
const IC={chart:`<path d="M4 20V11M10 20V5M16 20V9M3 20h18"/>`,receipt:`<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>`,cart:`<circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.4 11.2a1 1 0 0 0 1 .8h9.7a1 1 0 0 0 1-.8L21 7H6"/>`,gear:`<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>`,folder:`<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>`,camera:`<path d="M4 7h3l2-2.5h6L17 7h3v12H4z"/><circle cx="12" cy="12.5" r="3.5"/>`,photo:`<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/>`,pencil:`<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>`,check:`<path d="M5 12.5l4.5 4.5L19 7.5"/>`,plus:`<path d="M12 5v14M5 12h14"/>`};
const I=(n,z=16)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur='₽';let R=[],F=[],B=0,LB=0,SL=[],q='',fl='',fm=null,per='day',view='stats',draft=null,det=null,confirmDel=false;
const dbp=new Promise(r=>{try{const q=indexedDB.open('cheki',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function kv(k,v){const d=await dbp;if(!d)return;return new Promise(r=>{try{const s=d.transaction('kv',v===undefined?'readonly':'readwrite').objectStore('kv');const q=v===undefined?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}})}
const save=()=>kv('data',{R,F,B,LB,SL});
const num=v=>{let t=String(v??'').replace(/\s/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');return parseFloat(t.replace(',','.'))||0};
const money=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur;
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const pd=s=>new Date((s||today())+'T00:00:00');
const wk=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const fdate=s=>pd(s).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
const fts=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
function key(s){const d=pd(s);return per==='day'?iso(d):per==='week'?iso(wk(d)):iso(d).slice(0,7)}
function buckets(){const n=per==='day'?7:per==='week'?8:per==='year'?12:6,t=new Date(),o=[];
 for(let i=n-1;i>=0;i--){let d,l;
  if(per==='day'){d=new Date(t);d.setDate(d.getDate()-i);l=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}
  else if(per==='week'){d=wk(t);d.setDate(d.getDate()-7*i);l=d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')}
  else{d=new Date(t.getFullYear(),t.getMonth()-i,1);l=d.toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}
  const k=key(iso(d));o.push({k,l,s:0})}
 R.forEach(r=>{const b=o.find(x=>x.k===key(r.date));if(b)b.s+=r.total});return o}
const cap=t=>{t=String(t||'').trim();return t.charAt(0).toUpperCase()+t.slice(1)};
const PC=['#8aa8ff','#7ad7c1','#f6c177','#ff8fa3','#b69cff','#6ec1ff','#a3e635','#ffb26b'];
function pie(c){
 const g={};R.filter(r=>c.ks.includes(key(r.date))).forEach(r=>r.items.forEach(x=>{const nm=cap(x.name),k=nm.toLowerCase();if(!k)return;g[k]=g[k]||{n:nm,v:0};g[k].v+=x.price}));
 const big=Object.values(g).filter(x=>c.s&&x.v/c.s>0.1).sort((a,b)=>b.v-a.v);
 const rest=c.s-big.reduce((a,x)=>a+x.v,0),seg=big.map((x,i)=>({n:x.n,v:x.v,c:PC[i%PC.length]}));
 if(rest>0.005&&seg.length)seg.push({n:'Остальное',v:rest,c:'#3a4150'});
 const h='<h4>Товары свыше 10% расходов</h4>';
 if(!seg.length)return h+`<div class="card empty">${c.s?'Нет подходящих позиций за этот период':'Пока нет чеков за этот период'}</div>`;
 let a=0;const cg=seg.map(x=>{const f=a,t=a+x.v/c.s*100;a=t;return `${x.c} ${f}% ${t}%`}).join(',');
 return h+`<div class="card"><div class="dn" style="background:conic-gradient(${cg})"></div>${seg.map(x=>`<div class="li"><span><i class="dt" style="background:${x.c}"></i>${esc(x.n)}</span><span class="v">${Math.round(x.v/c.s*100)}% · ${money(x.v)}</span></div>`).join('')}</div>`}
const dis=new Set();
function mSpent(){const m=iso(new Date()).slice(0,7);return R.filter(r=>r.date.slice(0,7)===m).reduce((a,r)=>a+r.total,0)}
function bAlert(total,dt){if(!B||dt.slice(0,7)!==iso(new Date()).slice(0,7))return;const a=mSpent(),b0=a-total;if(b0<B&&a>=B)toast('Бюджет на месяц превышен');else if(b0<B*.8&&a>=B*.8)toast('Израсходовано больше 80% бюджета')}
function banners(){const out=[],now=new Date(),td=now.toDateString(),add=(id,t,btn)=>{if(!dis.has(id))out.push(`<div class="bn"><span>${t}</span>${btn?`<button data-act="${btn[0]}">${btn[1]}</button>`:''}<button class="bx" data-act="dis:${id}">×</button></div>`)};
 if(R.length&&!R.some(r=>r.addedAt&&new Date(r.addedAt).toDateString()===td))add('rem'+td,'Сегодня ещё не добавлены чеки',['plus','Добавить']);
 if(R.length&&(!LB||Date.now()-LB>7*864e5))add('bk'+Math.floor(Date.now()/864e5/7),'Пора сохранить резервную копию',['bak','Сохранить']);
 if(B){const m=iso(now).slice(0,7),sp=mSpent();if(sp>=B)add('bg100'+m,'Бюджет на месяц превышен');else if(sp>=B*.8)add('bg80'+m,'Израсходовано больше 80% бюджета')}
 return out.join('')}
function ksOf(b){return per==='year'?b.map(x=>x.k):[b[b.length-1].k]}
function topBlock(ks){const g={};R.forEach(r=>{if(!ks.includes(key(r.date)))return;r.items.forEach(x=>{const k=cap(x.name).toLowerCase();if(!k)return;g[k]=g[k]||{n:cap(x.name),v:0,c:0};g[k].v+=x.price;g[k].c++})});const a=Object.values(g);if(!a.length)return '';
 const exp=[...a].sort((x,y)=>y.v-x.v).slice(0,5),fr=[...a].sort((x,y)=>y.c-x.c||y.v-x.v).slice(0,5);
 const row=(x,t)=>`<div class="li"><span>${esc(x.n)}<small>${t}</small></span></div>`;
 return `<h4>Самые дорогие</h4><div class="card">${exp.map(x=>row(x,money(x.v))).join('')}</div><h4>Самые частые</h4><div class="card">${fr.map(x=>row(x,x.c+' раз · '+money(x.v))).join('')}</div>`}
function fcBlock(tot,c){if(per!=='month'||!tot)return '';const now=new Date();if(c.k!==iso(now).slice(0,7))return '';const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 return `<div class="card" style="padding:14px 16px;margin-top:12px"><small style="color:var(--sub)">Прогноз на конец месяца</small><div style="font-size:24px;font-weight:700;margin-top:4px">≈ ${money(Math.round(tot/now.getDate()*dim))}</div></div>`}
function stats(){
 const b=buckets(),c=b[b.length-1],mx=Math.max(...b.map(x=>x.s),1),ks=ksOf(b),tot=per==='year'?b.reduce((a,x)=>a+x.s,0):c.s;
 const pv=b.length>1?b[b.length-2].s:0,pn={day:'вчера',week:'прошлой неделе',month:'прошлому месяцу'}[per],dd=pv?(c.s-pv)/pv*100:0;
 const cmp=per==='year'?'За последние 12 месяцев':pv?`${dd>=0?'▲':'▼'} ${Math.abs(Math.round(dd))}% к ${pn}`:'Нет данных за прошлый период';
 const lbl={day:'Сегодня',week:'На этой неделе',month:'В этом месяце',year:'За 12 месяцев'}[per];
 const seg=[['day','День'],['week','Неделя'],['month','Месяц'],['year','Год']];
 return `<h1>Статистика</h1>
 ${budget()}
 <div class="seg">${seg.map(([k,n])=>`<button data-act="p:${k}" class="${per===k?'on':''}">${n}</button>`).join('')}</div>
 <div class="card"><div class="big"><small>${lbl}</small><div>${money(tot)}</div><small>${cmp}</small></div>
 <div class="chart">${b.map((x,i)=>`<i class="${i===b.length-1?'cur':''}"><b style="height:${Math.round(x.s/mx*100)}%"></b>${esc(x.l)}</i>`).join('')}</div></div>
 ${fcBlock(c.s,c)}
 ${pie({ks,s:tot})}
 ${topBlock(ks)}`}
const title=r=>{const n=r.items.map(x=>x.name).filter(Boolean);return n.length?n.slice(0,3).join(', ')+(n.length>3?'…':''):'Чек'};
const fname=id=>(F.find(x=>x.id===id)||{}).name||'';
const fopts=sel=>'<option value="">Без папки</option>'+F.map(f=>`<option value="${f.id}" ${f.id===sel?'selected':''}>${esc(f.name)}</option>`).join('');
function fsheet(){$('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="pk"><h3>${fm.id?'Папка':'Новая папка'}</h3><input id="fn" class="fi" maxlength="40" placeholder="Название, например «Продукты»" value="${esc(fm.name)}"><button class="pb" data-act="fsave">Сохранить</button>${fm.id?'<button class="pb d" data-act="fdel">Удалить папку (чеки останутся)</button>':''}</div></div>`;setTimeout(()=>{const n=$('#fn');n&&n.focus()},50)}
function trend(ms){if(ms.length<2)return '';ms=[...ms].sort((a,b)=>a.d<b.d?-1:1);const lo=Math.min(...ms.map(x=>x.p)),hi=Math.max(...ms.map(x=>x.p)),sp=hi-lo||1,pts=ms.map((x,i)=>`${i/(ms.length-1)*296+2},${54-(x.p-lo)/sp*48}`).join(' '),a=ms[0].p,z=ms[ms.length-1].p,d=a?(z-a)/a*100:0;
 return `<div class="card" style="padding:14px 16px;margin-bottom:12px"><small style="color:var(--sub)">Динамика цены: ${money(a)} → ${money(z)} (${d>=0?'+':''}${Math.round(d)}%)</small><svg viewBox="0 0 300 60" style="width:100%;height:60px;margin-top:8px"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/></svg></div>`}
function lst(){
 const ql=q.trim().toLowerCase(),has=x=>x.name.toLowerCase().includes(ql);
 const l=R.filter(r=>(fl===''||(fl==='_'?!r.folder:r.folder===fl))&&(!ql||r.items.some(has))).sort((a,b)=>b.addedAt-a.addedAt);
 const real=F.find(f=>f.id===fl);let info='';
 if(real)info+=`<div class="fa"><span>Итого: ${money(l.reduce((a,r)=>a+r.total,0))}</span><button data-act="rf">Изменить папку</button></div>`;
 if(ql){const ms=[];l.forEach(r=>r.items.filter(has).forEach(x=>ms.push({d:r.date,p:x.price})));info+=`<div class="fa"><span>«${esc(q.trim())}»: ${ms.length} поз. на ${money(ms.reduce((a,x)=>a+x.p,0))}</span></div>`+trend(ms)}
 return info+(l.length?`<div class="card">${l.map(r=>`<button class="li" data-act="open:${r.id}"><span>${esc(title(r))}<small>${fdate(r.date)} · ${r.items.length} поз.${fl===''&&r.folder?' · '+I('folder',13)+' '+esc(fname(r.folder)):''}</small></span><span class="v">${money(r.total)}</span></button>`).join('')}</div>`:`<div class="empty">${R.length?'Ничего не найдено.':'Чеков пока нет.<br>Нажмите «+», чтобы добавить первый.'}</div>`)}
function hist(){
 const un=R.filter(r=>!r.folder).length;
 return `<h1>История</h1><input id="q" class="sq" type="search" placeholder="Поиск по товарам" value="${esc(q)}"><div class="chips"><button class="ch ${fl===''?'on':''}" data-act="fl:">Все ${R.length}</button>${F.map(f=>`<button class="ch ${fl===f.id?'on':''}" data-act="fl:${f.id}">${I('folder',14)} ${esc(f.name)} ${R.filter(r=>r.folder===f.id).length}</button>`).join('')}${F.length&&un?`<button class="ch ${fl==='_'?'on':''}" data-act="fl:_">Без папки ${un}</button>`:''}<button class="ch add" data-act="nf">+ Папка</button></div><div id="lst">${lst()}</div>`}
function cfg(){$('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="pk"><h3>Настройки</h3><button class="pb g" data-act="set">Бюджет на месяц${B?': '+money(B):''}</button><button class="pb g" data-act="xls">Экспорт в Excel</button><button class="pb g" data-act="bak">Сохранить резервную копию</button><button class="pb g" data-act="imp">Импорт резервной копии</button></div></div>`}
function bsheet(){$('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="pk"><h3>Бюджет на месяц, ₽</h3><input id="bg" class="fi" inputmode="decimal" placeholder="Например, 50000 (0 — убрать)" value="${B||''}"><button class="pb" data-act="bsave">Сохранить</button></div></div>`}
async function dl(name,data,mime){if(window.AndroidSave){window.AndroidSave.save(name,data,mime||'application/octet-stream');return}let d=null;try{d=await(window.claude&&window.claude.use('downloads'))}catch(e){}
 if(d){try{await d.save({filename:name,data});return}catch(e){}}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime||'application/octet-stream'}));a.download=name;document.body.append(a);a.click();a.remove();return}catch(e){}
 $('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="pk"><h3>Скопируйте данные</h3><textarea id="dt" class="fi" style="height:160px;font-size:12px" readonly>${esc(data)}</textarea><button class="pb" data-act="cp">Скопировать</button><button class="pb g" data-act="bk">Закрыть</button></div></div>`}
function listView(){const got=SL.filter(x=>x.done).length;
 return `<h1>Список</h1>
 <div class="card" style="padding:10px 12px;margin-bottom:12px"><div class="row2" style="border:0;padding:0"><input id="sn" placeholder="Что купить" style="text-align:left"><button class="lk b" data-act="sadd">Добавить</button></div></div>
 ${SL.length?`<div class="card">${SL.map(x=>`<div class="li"><button class="ck ${x.done?'on':''}" data-act="stog:${x.id}">${x.done?I('check',14):''}</button><span style="flex:1;${x.done?'text-decoration:line-through;color:var(--sub)':''}">${esc(x.name)}</span><button class="x" data-act="sdel:${x.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Список пуст.<br>Добавляйте то, что нужно купить.</div>'}
 ${got?`<div style="margin-top:14px"><button class="pb" data-act="sbuy">Записать чек из отмеченных (${got})</button></div>`:'<small style="display:block;color:var(--sub);text-align:center;margin-top:12px">Отметьте купленное, и можно сразу записать чек</small>'}`}
function xsheet(){$('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="pk"><h3>Таблица за период</h3><button class="pb g" data-act="xp:day">За день</button><button class="pb g" data-act="xp:week">За неделю</button><button class="pb g" data-act="xp:month">За месяц</button></div></div>`}
function xlsx(rows,sheet){const c=v=>typeof v==='number'?`<Cell><Data ss:Type="Number">${v}</Data></Cell>`:`<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`;
 const body=rows.map(r=>`<Row>${r.map(c).join('')}</Row>`).join('');
 return `<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="b"><Font ss:Bold="1"/></Style></Styles><Worksheet ss:Name="${esc(sheet)}"><Table>${body}</Table></Worksheet></Workbook>`}
function xport(p){
 const now=new Date(),inP=d=>p==='day'?d===today():p==='week'?iso(wk(pd(d)))===iso(wk(now)):d.slice(0,7)===iso(now).slice(0,7);
 const L={day:'день',week:'неделю',month:'месяц'}[p],list=R.filter(r=>inP(r.date)).sort((a,b)=>a.date<b.date?-1:1);
 if(!list.length){toast('Нет чеков за этот период');return}
 const rows=[['Дата','Папка','Товар','Цена','Итого по чеку']];
 list.forEach(r=>{if(r.items.length)r.items.forEach(x=>rows.push([r.date,fname(r.folder),x.name,x.price,r.total]));else rows.push([r.date,fname(r.folder),'','',r.total])});
 rows.push([]);rows.push(['Итого за '+L,'','','',list.reduce((a,r)=>a+r.total,0)]);
 $('#modal').innerHTML='';
 dl(`cheki-${p}-${today()}.xls`,xlsx(rows,'Чеки за '+L),'application/vnd.ms-excel')}
function budget(){const m=iso(new Date()).slice(0,7),sp=R.filter(r=>r.date.slice(0,7)===m).reduce((a,r)=>a+r.total,0);
 if(!B)return '<button class="ch add" data-act="set" style="margin-bottom:14px">+ Задать бюджет на месяц</button>';
 const p=sp/B*100;return `<div class="card big" style="margin-bottom:16px"><small>Бюджет на месяц · ${money(sp)} из ${money(B)}</small><div class="pg"><b style="width:${Math.min(p,100)}%;background:${p>100?'var(--rd)':p>80?'#f6c177':'var(--ac)'}"></b></div><small>${p>100?'Превышен на '+money(sp-B):'Осталось '+money(B-sp)+' ('+Math.round(p)+'%)'}</small></div>`}
function render(){$('#app').innerHTML=banners()+(view==='stats'?stats():view==='list'?listView():hist());$('#t1').className=view==='stats'?'on':'';$('#t2').className=view==='hist'?'on':'';$('#t3').className=view==='list'?'on':''}
function detail(){const r=det;return `<div class="ov"><div class="bar"><button class="lk" data-act="close">‹ Назад</button><b>Чек</b><button class="lk" data-act="edit">Изменить</button></div><div class="sc">
 <div class="card big"><small>${esc(title(r))} · ${fdate(r.date)}</small><div>${money(r.total)}</div></div>
 <h4>Позиции</h4><div class="card">${r.items.length?r.items.map(x=>`<div class="li"><span>${esc(x.name)}</span><span class="v">${money(x.price)}</span></div>`).join(''):'<div class="li"><small>Позиции не указаны</small></div>'}<div class="li"><b>Итого</b><span class="v">${money(r.total)}</span></div></div>
 <h4>Папка</h4><div class="grp"><label>Папка<select id="dfs">${fopts(r.folder)}</select></label></div><h4>Дата чека</h4><div class="grp"><label>Дата<input type="date" id="dd" value="${esc(r.date)}"></label></div><h4>Добавлен</h4><div class="card"><div class="li"><span>${fts(r.addedAt)}</span></div></div>
 ${r.imgs.length?'<h4>Фото чека</h4>'+r.imgs.map(u=>`<img class="photo" src="${u}">`).join(''):''}
 <h4></h4><div class="card"><button class="li" data-act="rep">Повторить как новый чек</button></div><h4></h4><div class="card"><button class="li" style="color:var(--rd)" data-act="rm">${confirmDel?'Нажмите ещё раз для удаления':'Удалить чек'}</button></div></div></div>`}
function form(){const d=draft;return `<div class="ov"><div class="bar"><button class="lk" data-act="cancel">Отмена</button><b>${d.editId?'Чек':'Новый чек'}</b><button class="lk b" data-act="save">Сохранить</button></div><div class="sc">
 ${d.imgs.map(u=>`<img class="ph" src="${u}">`).join('')}<button class="lk add" data-act="more">${I('plus',16)} Добавить фото</button>
 <div class="grp"><label>Дата<input type="date" data-f="date" value="${esc(d.date)}"></label><label>Папка<select data-f="folder">${fopts(d.folder)}</select></label></div>
 <h4>Позиции</h4><div class="grp">${d.items.map((x,i)=>`<div class="row2"><input data-i="${i}" data-k="name" value="${esc(x.name)}" placeholder="Наименование"><input data-i="${i}" data-k="price" inputmode="decimal" value="${esc(x.price)}" placeholder="0,00"><button class="x" data-act="del:${i}">×</button></div>`).join('')}<button class="lk add" data-act="addrow">+ Добавить позицию</button></div>
 <h4>Сумма</h4><div class="grp"><label>Итого, ${esc(cur)}<input id="tot" data-f="total" inputmode="decimal" value="${esc(d.total)}" placeholder="0,00"></label></div></div></div>`}
function showForm(){const s=$('#modal .sc'),y=s?s.scrollTop:0;$('#modal').innerHTML=form();const n=$('#modal .sc');if(n)n.scrollTop=y}
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3500)};
function newDraft(o={}){draft={folder:o.folder??(fl&&fl!=='_'?fl:''),date:o.date||today(),items:(o.items||[]).map(x=>({name:x.name||'',price:x.price??''})),total:o.total??'',imgs:o.imgs||[],te:!!o.te,editId:o.editId||null,addedAt:o.addedAt};if(!draft.items.length&&!draft.imgs.length)draft.items=[{name:'',price:''}];showForm()}
function shrink(f,mx=1400){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res({blob:b,url:c.toDataURL('image/jpeg',.7)}),'image/jpeg',.8)};im.onerror=rej;im.src=u})}
async function attachPhotos(fs){
 const busy=document.createElement('div');busy.className='busy';busy.innerHTML='<div><div class="sp"></div>Добавляю фото…</div>';document.body.append(busy);
 const urls=[];try{for(const f of fs)urls.push((await shrink(f)).url)}catch(e){busy.remove();toast('Не удалось открыть фото');return}
 busy.remove();
 if(draft){draft.imgs.push(...urls);showForm()}else newDraft({imgs:urls});
 toast('Фото добавлено');
}
function sheet(){$('#modal').innerHTML=`<div class="bk" data-act="bk"><div class="sh"><button data-act="cam">${I('camera',20)} Сфотографировать чек</button><button data-act="gal">${I('photo',20)} Выбрать из галереи</button><button data-act="man">${I('pencil',20)} Ввести вручную</button><button class="c" data-act="bk">Отмена</button></div></div>`}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 if(t.classList.contains('bk')&&e.target!==t)return;
 const [a,v]=t.dataset.act.split(':');
 if(a==='v'){view=v;render()}
 else if(a==='p'){per=v;render()}
 else if(a==='plus')sheet();
 else if(a==='rep'){const r=det;det=null;newDraft({folder:r.folder,date:today(),items:r.items.map(x=>({name:x.name,price:x.price})),total:r.total,te:true})}
 else if(a==='dis'){dis.add(v);render()}
 else if(a==='cp'){navigator.clipboard.writeText($('#dt').value).then(()=>toast('Скопировано')).catch(()=>{$('#dt').select();toast('Выделите текст и скопируйте')})}
 else if(a==='fl'){fl=v;render()}
 else if(a==='nf'){fm={id:null,name:''};fsheet()}
 else if(a==='rf'){const f=F.find(x=>x.id===fl);if(f){fm={id:f.id,name:f.name};fsheet()}}
 else if(a==='fsave'){const n=$('#fn').value.trim();if(!n){toast('Введите название');return}
  if(fm.id)F.find(x=>x.id===fm.id).name=n;else{fm.id='f'+Date.now().toString(36);F.push({id:fm.id,name:n});fl=fm.id}
  save();fm=null;$('#modal').innerHTML='';render()}
 else if(a==='fdel'){R.forEach(r=>{if(r.folder===fm.id)r.folder=''});F=F.filter(f=>f.id!==fm.id);fl='';save();fm=null;$('#modal').innerHTML='';render()}
 else if(a==='bk')$('#modal').innerHTML='';
 else if(a==='cam'){$('#modal').innerHTML='';$('#cam').click()}
 else if(a==='gal'){$('#modal').innerHTML='';$('#gal').click()}
 else if(a==='man')newDraft();
 else if(a==='cancel'){draft=null;$('#modal').innerHTML=''}
 else if(a==='addrow'){draft.items.push({name:'',price:''});showForm()}
 else if(a==='del'){draft.items.splice(+v,1);if(!draft.te)draft.total=draft.items.reduce((s,x)=>s+num(x.price),0)||'';showForm()}
 else if(a==='save'){
  const it=draft.items.filter(x=>x.name.trim()||num(x.price)).map(x=>({name:cap(x.name)||'Позиция',price:num(x.price)}));
  const total=num(draft.total)||it.reduce((a,x)=>a+x.price,0);
  if(!total){toast('Укажите позиции или итоговую сумму');return}
  const dt=draft.date||today();
  if(!draft.editId&&!draft.dup&&R.some(r=>r.date===dt&&Math.abs(r.total-total)<.005)){draft.dup=1;toast('Похоже, такой чек уже есть. Нажмите «Сохранить» ещё раз, если это другой чек');return}
  const rec={folder:draft.folder||'',id:draft.editId||Date.now().toString(36),date:dt,items:it,total,imgs:draft.imgs,addedAt:draft.addedAt||Date.now()};
  const ed=draft.editId;if(ed)R=R.map(r=>r.id===ed?rec:r);else R.push(rec);
  save();draft=null;$('#modal').innerHTML='';view='hist';render();toast('Чек сохранён');if(!ed)bAlert(total,dt)}
 else if(a==='edit'){const r=det;det=null;newDraft({...r,te:true,editId:r.id})}
 else if(a==='more')$('#gal').click()
 else if(a==='cfg')cfg()
 else if(a==='set')bsheet()
 else if(a==='bsave'){B=num($('#bg').value);save();$('#modal').innerHTML='';render()}
 else if(a==='sadd'){const n=$('#sn').value.trim();if(!n)return;SL.push({id:Date.now().toString(36),name:cap(n),done:false});save();render();setTimeout(()=>{const e=$('#sn');e&&e.focus()},30)}
 else if(a==='stog'){const x=SL.find(y=>y.id===v);if(x)x.done=!x.done;save();render()}
 else if(a==='sdel'){SL=SL.filter(y=>y.id!==v);save();render()}
 else if(a==='sbuy'){const got=SL.filter(x=>x.done);SL=SL.filter(x=>!x.done);save();$('#modal').innerHTML='';newDraft({items:got.map(x=>({name:x.name,price:''}))});toast('Введите цены и сохраните чек')}
 else if(a==='xls')xsheet();
 else if(a==='xp')xport(v);
 else if(a==='bak'){$('#modal').innerHTML='';LB=Date.now();save();dl('cheki-backup.json',JSON.stringify({v:1,R,F,B}))}
 else if(a==='imp'){$('#modal').innerHTML='';$('#imp').click()}
 else if(a==='open'){det=R.find(r=>r.id===v);confirmDel=false;$('#modal').innerHTML=detail()}
 else if(a==='close'){det=null;$('#modal').innerHTML=''}
 else if(a==='rm'){if(!confirmDel){confirmDel=true;$('#modal').innerHTML=detail();return}
  R=R.filter(r=>r!==det);save();det=null;$('#modal').innerHTML='';render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;$('#lst').innerHTML=lst();return}if(!draft)return;
 if(t.dataset.f){draft[t.dataset.f]=t.value;if(t.dataset.f==='total')draft.te=true}
 else if(t.dataset.i!==undefined){draft.items[+t.dataset.i][t.dataset.k]=t.value;
  if(t.dataset.k==='price'&&!draft.te){const s=draft.items.reduce((a,x)=>a+num(x.price),0);draft.total=s?s.toFixed(2):'';$('#tot').value=draft.total}}});
document.addEventListener('change',e=>{
 if(e.target.id==='dd'&&det&&e.target.value){det.date=e.target.value;save();render();return}
 if(e.target.id==='dfs'&&det){det.folder=e.target.value;save();render()}
 if(e.target.id==='cam'||e.target.id==='gal'){const fs=[...e.target.files];e.target.value='';if(fs.length)attachPhotos(fs)}
 if(e.target.id==='imp'){const f=e.target.files[0];e.target.value='';if(f)f.text().then(t=>{try{const d=JSON.parse(t);let n=0;(d.F||[]).forEach(x=>{if(!F.some(y=>y.id===x.id))F.push(x)});(d.R||[]).forEach(r=>{if(r&&r.id&&!R.some(y=>y.id===r.id)){r.imgs=r.imgs||(r.img?[r.img]:[]);R.push(r);n++}});if(!B&&d.B)B=d.B;save();render();toast('Импортировано чеков: '+n)}catch(x){toast('Не удалось прочитать файл')}})}});
(async()=>{const d=await kv('data');if(d){R=d.R||[];F=d.F||[];B=d.B||0;LB=d.LB||0;SL=d.SL||[];R.forEach(r=>{if(!r.imgs)r.imgs=r.img?[r.img]:[]})}render()})();
render();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js")}</script>
